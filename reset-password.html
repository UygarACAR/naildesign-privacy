<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Nail Design AI — Reset Password</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6; max-width: 440px; margin: 0 auto; padding: 48px 20px 64px;
    color: #1c1c22; background: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #ECECF1; background: #17121a; }
    input { background: #221a26; color: #ECECF1; border-color: #3a2f3e; }
  }
  h1 { font-size: 1.6rem; margin-bottom: .4rem; }
  p { margin-top: 0; }
  label { display: block; font-weight: 600; margin: 18px 0 6px; }
  input {
    width: 100%; box-sizing: border-box; font-size: 1rem; padding: 12px 14px;
    border: 1px solid #e3d9df; border-radius: 12px;
  }
  button {
    margin-top: 24px; width: 100%; font-size: 1rem; font-weight: 700; color: #fff;
    background: #E84393; border: 0; border-radius: 14px; padding: 14px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .msg { padding: 12px 14px; border-radius: 12px; margin-top: 20px; }
  .error { background: #fde8ee; color: #9b1c47; }
  .ok { background: #e7f6ec; color: #1d6b39; }
  @media (prefers-color-scheme: dark) {
    .error { background: #3d1624; color: #f7a1c9; }
    .ok { background: #15321f; color: #9fe0b4; }
  }
</style>
</head>
<body>
<h1>Reset your password</h1>
<p id="intro">Choose a new password for your Nail Design AI account.</p>

<form id="form" hidden>
  <label for="pw">New password</label>
  <input id="pw" type="password" autocomplete="new-password" minlength="6" required>
  <label for="pw2">Confirm new password</label>
  <input id="pw2" type="password" autocomplete="new-password" minlength="6" required>
  <button id="submit" type="submit">Update password</button>
</form>
<div id="status" class="msg" hidden></div>

<script>
  // Supabase's password-recovery link redirects here with a short-lived session
  // in the URL fragment (#access_token=…&type=recovery). We use it once to set
  // the new password, then the user signs in again in the app.
  var SUPABASE_URL = "https://snwvvkzqknlzdrfakxyc.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNud3Z2a3pxa25semRyZmFreHljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NDM5NzMsImV4cCI6MjEwNTIxOTk3M30.Yg35IUL1oPeKKs7fOkNHHHd757NcIJ9Y58svBCRHeJ0";

  var params = new URLSearchParams(location.hash.replace(/^#/, ""));
  // Drop the token from the address bar and history.
  if (location.hash) history.replaceState(null, "", location.pathname);

  var form = document.getElementById("form");
  var statusEl = document.getElementById("status");
  var intro = document.getElementById("intro");

  function show(text, kind) {
    statusEl.textContent = text;
    statusEl.className = "msg " + kind;
    statusEl.hidden = false;
  }

  var token = params.get("access_token");
  if (params.get("error") || params.get("error_code")) {
    intro.hidden = true;
    show("This reset link is invalid or has expired. In the app, tap “Forgot password?” to get a new one.", "error");
  } else if (!token || params.get("type") !== "recovery") {
    intro.hidden = true;
    show("Open this page from the password reset email we sent you.", "error");
  } else {
    form.hidden = false;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = document.getElementById("pw").value;
    var pw2 = document.getElementById("pw2").value;
    if (pw.length < 6) { show("Use at least 6 characters.", "error"); return; }
    if (pw !== pw2) { show("The passwords don’t match.", "error"); return; }

    var button = document.getElementById("submit");
    button.disabled = true;
    fetch(SUPABASE_URL + "/auth/v1/user", {
      method: "PUT",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ password: pw })
    }).then(function (res) {
      if (res.ok) {
        form.hidden = true;
        intro.hidden = true;
        show("Your password has been updated. Go back to the Nail Design AI app and sign in with your new password.", "ok");
        token = null;
      } else {
        return res.json().catch(function () { return {}; }).then(function (body) {
          var msg = body.msg || body.message || body.error_description || "";
          show((msg ? msg + " " : "") + "If this keeps happening, request a new reset link from the app.", "error");
          button.disabled = false;
        });
      }
    }).catch(function () {
      show("Couldn’t reach the server. Check your connection and try again.", "error");
      button.disabled = false;
    });
  });
</script>
</body>
</html>
